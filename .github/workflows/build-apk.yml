name: Build Android APK & AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build LiveNex TV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveNex-TV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Check release signing secrets
        id: check_secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_release_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets not configured; skipping release build."
          fi

      - name: Decode release keystore
        if: steps.check_secrets.outputs.has_release_secrets == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > my-upload-key.jks

      - name: Build Signed Release APK & AAB
        if: steps.check_secrets.outputs.has_release_secrets == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Clean up release keystore
        if: always() && steps.check_secrets.outputs.has_release_secrets == 'true'
        run: rm -f my-upload-key.jks

      - name: Upload Signed Release APK artifact
        if: steps.check_secrets.outputs.has_release_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LiveNex-TV-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Signed Release AAB artifact (Google Play)
        if: steps.check_secrets.outputs.has_release_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LiveNex-TV-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
